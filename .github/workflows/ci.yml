name: Java CI - BDD y Performance

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master


jobs:

  functional-tests:

    name: Pruebas funcionales y BDD

    runs-on: ubuntu-latest

    steps:

      # Descargar el código del repositorio
      - name: Obtener código
        uses: actions/checkout@v4

      # Configurar Java
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Ejecutar pruebas unitarias y escenarios BDD
      - name: Ejecutar pruebas funcionales
        run: |
          mvn clean test -Dtest='LoginServiceTest,CucumberTest'

      # Publicar reportes generados por Maven/JUnit
      - name: Publicar reporte JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-junit
          path: target/surefire-reports/

      # Publicar reporte HTML de Cucumber
      - name: Publicar reporte BDD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cucumber
          path: target/cucumber-report.html


  performance-tests:

    name: Prueba de performance

    needs: functional-tests

    runs-on: ubuntu-latest

    # Valores que serán enviados al Quality Gate
    outputs:
      tps: ${{ steps.metrics.outputs.tps }}
      latency: ${{ steps.metrics.outputs.latency }}
      errors: ${{ steps.metrics.outputs.errors }}

    steps:

      # Descargar el código
      - name: Obtener código
        uses: actions/checkout@v4

      # Configurar Java
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Ejecutar prueba de performance
      - name: Ejecutar prueba de performance
        run: |
          mvn test -Dtest=LoginPerformanceTest \
            | tee performance-result.txt

      # Extraer las métricas generadas por la prueba
      - name: Extraer métricas
        id: metrics
        run: |

          TPS=$(grep "TPS:" performance-result.txt | \
            sed 's/.*TPS: //')

          LATENCIA=$(grep "Latencia promedio:" performance-result.txt | \
            sed 's/.*Latencia promedio: //' | \
            sed 's/ ms//')

          ERRORES=$(grep "Tasa de errores:" performance-result.txt | \
            sed 's/.*Tasa de errores: //' | \
            sed 's/%//')

          echo "TPS=$TPS"
          echo "LATENCIA=$LATENCIA ms"
          echo "ERRORES=$ERRORES %"

          # Guardar valores como outputs del job
          echo "tps=$TPS" >> "$GITHUB_OUTPUT"
          echo "latency=$LATENCIA" >> "$GITHUB_OUTPUT"
          echo "errors=$ERRORES" >> "$GITHUB_OUTPUT"


      # Mostrar las métricas en el resumen de GitHub Actions
      - name: Generar dashboard de métricas
        if: always()
        run: |

          TPS="${{ steps.metrics.outputs.tps }}"
          LATENCIA="${{ steps.metrics.outputs.latency }}"
          ERRORES="${{ steps.metrics.outputs.errors }}"        

          echo "## Resultados de Performance" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Métrica | Resultado | Umbral |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---:|---:|" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| TPS | $TPS | > 1000 |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Latencia | $LATENCIA ms | < 1 ms |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Tasa de errores | $ERRORES % | < 1 % |" \
            >> "$GITHUB_STEP_SUMMARY"


      # Guardar el resultado completo como artefacto
      - name: Publicar reporte de performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-performance
          path: performance-result.txt


  quality-gate:

    name: Quality Gate

    needs:
      - functional-tests
      - performance-tests

    runs-on: ubuntu-latest

    steps:

      # Evaluar las métricas obtenidas
      - name: Evaluar métricas de calidad
        run: |

          TPS="${{ needs.performance-tests.outputs.tps }}"
          LATENCIA="${{ needs.performance-tests.outputs.latency }}"
          ERRORES="${{ needs.performance-tests.outputs.errors }}"

          echo "======================================"
          echo "           QUALITY GATE"
          echo "======================================"

          echo "TPS: $TPS"
          echo "Latencia: $LATENCIA ms"
          echo "Tasa de errores: $ERRORES %"

          echo "======================================"

          # Verificar TPS mínimo
          if (( $(echo "$TPS < 1000" | bc -l) )); then
            echo "QUALITY GATE: TPS inferior a 1000"
            exit 1
          fi

          # Verificar latencia máxima
          if (( $(echo "$LATENCIA >= 1" | bc -l) )); then
            echo "QUALITY GATE: Latencia igual o superior a 1 ms"
            exit 1
          fi

          # Verificar tasa máxima de errores
          if (( $(echo "$ERRORES >= 1" | bc -l) )); then
            echo "QUALITY GATE: Tasa de errores igual o superior al 1%"
            exit 1
          fi

          echo "QUALITY GATE: PASS"


      # Mostrar resultado en el resumen
      - name: Publicar resultado del Quality Gate
        if: always()
        run: |

          echo "## Quality Gate" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Criterio | Umbral |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---:|" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| TPS | > 1000 |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Latencia | < 1 ms |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Errores | < 1 % |" \
            >> "$GITHUB_STEP_SUMMARY"